server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history mode — fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML shell, so a new deploy is picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Reverse proxy to the Laravel backend when both containers share a Docker
    # network (docker compose). The hostname is resolved per request, so nginx
    # still starts when no "backend" host exists (on AWS the ALB routes these
    # paths straight to the backend instead).
    location ~ ^/(api|sanctum|storage)/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    # Cache static assets (file names are content-hashed by Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
